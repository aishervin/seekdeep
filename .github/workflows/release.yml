name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            LAST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)
            if [[ -z "$LAST" ]]; then
              VERSION="1.0.0"
            else
              CURRENT="${LAST#v}"
              IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
              VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$VERSION" -m "Seekdeep v$VERSION"
            git push origin "v$VERSION"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Release: v$VERSION (versionCode=$VERSION_CODE)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Write Android local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties

      - name: Install web dependencies
        run: npm ci

      - name: Build web bundles
        run: npm run build

      - name: Build Android web bundle
        run: npm run build:android

      - name: Ensure Gradle wrapper
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -fsSL "https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
            cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          fi
          chmod +x ./gradlew

      - name: Prepare Android signing
        id: signing
        env:
          BDS_KEYSTORE: ${{ secrets.BDS_KEYSTORE }}
          BDS_KEYSTORE_PASSWORD: ${{ secrets.BDS_KEYSTORE_PASSWORD }}
          BDS_KEY_ALIAS: ${{ secrets.BDS_KEY_ALIAS }}
          BDS_KEY_PASSWORD: ${{ secrets.BDS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$BDS_KEYSTORE" && -n "$BDS_KEYSTORE_PASSWORD" && -n "$BDS_KEY_ALIAS" && -n "$BDS_KEY_PASSWORD" ]]; then
            printf '%s' "$BDS_KEYSTORE" | base64 --decode > android/ci-release.jks
            test -s android/ci-release.jks
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Persistent release signing secrets are available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: BDS_* signing secrets are not configured. Building unsigned release APKs for CI validation."
          fi

      - name: Build ARM release APKs
        working-directory: android
        run: ./gradlew --no-daemon clean assembleRelease -PversionName="${{ steps.version.outputs.version }}" -PversionCode="${{ steps.version.outputs.version_code }}"
        env:
          BDS_KEYSTORE_PASSWORD: ${{ secrets.BDS_KEYSTORE_PASSWORD }}
          BDS_KEY_ALIAS: ${{ secrets.BDS_KEY_ALIAS }}
          BDS_KEY_PASSWORD: ${{ secrets.BDS_KEY_PASSWORD }}

      - name: Rename and verify APKs
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          OUT="android/app/build/outputs/apk/release"
          UNIVERSAL=$(find "$OUT" -type f -name '*universal*release.apk' | head -n 1)
          ARM64=$(find "$OUT" -type f -name '*arm64-v8a*release.apk' | head -n 1)
          ARMV7=$(find "$OUT" -type f -name '*armeabi-v7a*release.apk' | head -n 1)
          [[ -n "$UNIVERSAL" && -n "$ARM64" && -n "$ARMV7" ]] || { find "$OUT" -type f -name '*.apk' -print; exit 1; }

          VERSION="${{ steps.version.outputs.version }}"
          cp "$UNIVERSAL" "Seekdeep-universal-v$VERSION.apk"
          cp "$ARM64" "Seekdeep-arm64-v8a-v$VERSION.apk"
          cp "$ARMV7" "Seekdeep-armeabi-v7a-v$VERSION.apk"

          if [[ "${{ steps.signing.outputs.available }}" == "true" ]]; then
            for apk in Seekdeep-universal-v$VERSION.apk Seekdeep-arm64-v8a-v$VERSION.apk Seekdeep-armeabi-v7a-v$VERSION.apk; do
              "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
            done

            CERT1=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "Seekdeep-universal-v$VERSION.apk" | grep 'Signer #1 certificate SHA-256 digest' | head -n1)
            CERT2=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "Seekdeep-arm64-v8a-v$VERSION.apk" | grep 'Signer #1 certificate SHA-256 digest' | head -n1)
            CERT3=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "Seekdeep-armeabi-v7a-v$VERSION.apk" | grep 'Signer #1 certificate SHA-256 digest' | head -n1)
            [[ "$CERT1" == "$CERT2" && "$CERT1" == "$CERT3" ]] || { echo "APK certificates differ"; exit 1; }
            echo "All APKs are signed by the same release certificate."
          else
            echo "Unsigned APKs produced because persistent signing secrets are not configured."
          fi

          echo "universal=Seekdeep-universal-v$VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "arm64=Seekdeep-arm64-v8a-v$VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "armv7=Seekdeep-armeabi-v7a-v$VERSION.apk" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Seekdeep v${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            ${{ steps.apk.outputs.universal }}
            ${{ steps.apk.outputs.arm64 }}
            ${{ steps.apk.outputs.armv7 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
